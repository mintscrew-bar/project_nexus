name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 최소 권한 원칙: 워크플로우 전체에 읽기 권한만 부여
permissions:
  contents: read

jobs:
  ci:
    name: Lint / Build / Test
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v6

      # 버전은 루트 package.json의 packageManager 필드(pnpm@8.15.0)에서 읽는다.
      # version 입력을 함께 주면 버전이 어긋날 때 에러가 나므로 단일 출처로 유지한다.
      - name: pnpm 설치
        uses: pnpm/action-setup@v6

      - name: Node.js 22 설정
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: Prisma 클라이언트 생성
        run: pnpm db:generate

      - name: 린트
        run: pnpm lint

      - name: 빌드
        run: pnpm build
        env:
          # Next.js standalone 빌드에 필요한 더미 환경변수
          NEXTAUTH_SECRET: ci-dummy-secret
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:4000
          API_URL: http://localhost:4000

      - name: 테스트
        run: pnpm test -- -- --passWithNoTests

  # 버전 자동 범프 — 반드시 단일 잡에서만 돈다.
  # 이미지 빌드를 matrix 로 병렬화했기 때문에, 범프가 빌드 잡 안에 있으면
  # api/web 두 레그가 동시에 push-back 을 시도해 커밋이 꼬인다.
  bump:
    name: 버전 자동 범프
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v6
        with:
          # 자동 범프가 이번 push 범위의 전체 커밋을 분석한다.
          fetch-depth: 0

      - name: 버전 자동 범프
        continue-on-error: true
        if: github.event.before != '0000000000000000000000000000000000000000'
        env:
          BASE_REF: ${{ github.event.before }}
        run: |
          # 수동 범프가 포함된 push는 다시 올리지 않는다.
          if [ -n "$(git log --format=%H -G'\"version\":' "${BASE_REF}..HEAD" -- package.json)" ]; then
            echo "범위에 version 변경 커밋 존재 → 이미 릴리스됨, 스킵"
            exit 0
          fi
          node scripts/bump-version.mjs || { echo "범프 대상 없음/스킵"; exit 0; }
          git diff --quiet && { echo "버전 변경 없음"; exit 0; }
          NEW=$(node -e "console.log(require('./package.json').version)")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json apps/api/package.json apps/web/package.json
          git commit -m "chore(release): 버전 ${NEW} [skip ci]"
          git push origin HEAD:main \
            || echo "push-back 실패(비치명) — 이번 이미지엔 ${NEW} 반영됨"

      # 빌드 잡은 이 커밋(github.sha)을 체크아웃하므로 범프 결과가 들어있지 않다.
      # ref 를 넘기지 않고 파일로 넘기는 이유: push-back 이 실패하면 그 커밋은
      # 원격에 없어서 빌드 잡의 체크아웃이 깨진다.
      - name: 버전 파일 전달
        uses: actions/upload-artifact@v4
        with:
          name: version-files
          path: |
            package.json
            apps/api/package.json
            apps/web/package.json
          retention-days: 1

  # 어떤 이미지를 새로 빌드해야 하는지 판별한다.
  # 안 바뀐 앱은 빌드 대신 직전 이미지를 이번 SHA 로 재태그한다(수 초).
  # CD 가 api/web 양쪽을 IMAGE_TAG=<sha> 로 pull 하므로 태그는 항상 존재해야 한다.
  #
  # 비교 기준은 "직전 push(github.event.before)"가 아니라 **각 앱의 latest 이미지가
  # 실제로 담고 있는 커밋**(이미지 라벨 org.opencontainers.image.revision)이다.
  # 직전 push 기준이면 CI 가 한 번 깨진 push 의 변경이 영영 빌드되지 않는다:
  #   push A(web 변경) → lint 실패로 이미지 빌드 안 됨
  #   push B(api 만 변경) → "web 안 바뀜" → 낡은 web:latest 를 B 로 재태그 → 운영엔 옛 화면
  # 2026-09-22 로비 개편이 이렇게 빠졌다. 재태그는 라벨도 그대로 복사하므로
  # 라벨은 항상 "그 이미지 코드의 출처 커밋"을 가리킨다.
  changes:
    name: 변경 범위 판별
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: GHCR 로그인
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 변경 경로 분류
        id: filter
        env:
          IMAGE_PREFIX: ghcr.io/mintscrew-bar/project_nexus
        run: |
          set -euo pipefail

          # 이미지에 안 들어가는 경로. 여기만 바뀌었으면 어느 이미지도 새로 만들 필요가 없다.
          # nginx.conf 는 bind mount, systemd/scripts 는 호스트 파일이다.
          IGNORE_RE='^(docs|scripts|systemd|nginx|load-test|tools|\.github)/|\.md$'

          # latest 이미지 라벨에서 출처 커밋을 읽는다. 없으면(라벨 도입 전 이미지, 이미지 없음) 빈 값.
          # 인덱스(attestation 포함)여도 imagetools 는 실제 플랫폼 하나만 .Image 로 보여준다.
          image_revision() {
            docker buildx imagetools inspect "${IMAGE_PREFIX}/$1:latest" --format '{{json .Image}}' 2>/dev/null \
              | jq -r 'if has("config") then . else .["linux/amd64"] end
                       | .config.Labels // {} | .["org.opencontainers.image.revision"] // empty' \
              || true
          }

          # 앱 하나를 판별한다. 확실하지 않으면 빌드한다 —
          # 덜 빌드해서 낡은 이미지가 나가는 것보다 더 빌드해서 느린 편이 안전하다.
          decide() {
            local app="$1" base
            base=$(image_revision "$app")
            if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              echo "[$app] latest 출처 커밋 불명(${base:-라벨 없음}) → 빌드" >&2
              echo true; return
            fi
            local changed
            changed=$(git diff --name-only "$base" "$GITHUB_SHA")
            # 같은 커밋 재실행 등 변경이 없으면 빈 줄이 공용 변경으로 잡히지 않게 먼저 끝낸다
            if [ -z "$changed" ]; then
              echo "[$app] 기준 ${base:0:7} 이후 변경 없음" >&2
              echo false; return
            fi
            echo "[$app] 기준 ${base:0:7} 이후 변경:" >&2
            echo "$changed" | sed 's/^/  /' >&2
            # 이 앱 경로, 또는 어느 앱도 아니면서 무시 대상도 아닌 공용 파일
            # (packages/, pnpm-lock.yaml, package.json, turbo.json 등)
            if echo "$changed" | grep -qE "^apps/${app}/" \
              || echo "$changed" | grep -Ev '^apps/(api|web)/' | grep -Evq "$IGNORE_RE"; then
              echo true
            else
              echo false
            fi
          }

          API=$(decide api)
          WEB=$(decide web)
          echo "api=$API" >> "$GITHUB_OUTPUT"
          echo "web=$WEB" >> "$GITHUB_OUTPUT"
          echo "판별 결과 — api 빌드: $API / web 빌드: $WEB"

  # Docker 이미지 빌드 + GHCR 푸시
  # - main 브랜치 push 일 때만 실행 (PR 에서는 스킵)
  # - GitHub-hosted runner 에서 빌드 → 운영 서버 부하 0
  # - api/web 을 matrix 로 병렬 실행한다. 직렬일 때 3.6분 + 4.9분 이던 것이
  #   느린 쪽 하나(약 4.9분)로 줄어든다.
  docker:
    name: Docker (${{ matrix.app }})
    needs: [bump, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # 한쪽이 깨져도 다른 쪽은 끝까지 간다. 어느 이미지가 문제인지 바로 보인다.
      fail-fast: false
      matrix:
        app: [api, web]
    env:
      REGISTRY: ghcr.io
      # ghcr.io 는 lowercase 강제 — 소유자/저장소가 이미 lowercase 라 그대로 사용
      IMAGE_PREFIX: ghcr.io/mintscrew-bar/project_nexus

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v6

      - name: 버전 파일 적용
        uses: actions/download-artifact@v4
        with:
          name: version-files

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v4

      - name: GHCR 로그인
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 변경이 없으면 레지스트리 안에서 manifest 만 복사한다. 내려받지도 다시 올리지도
      # 않으므로 수 초면 끝난다. 실패하면(예: latest 가 아직 없음) 아래 빌드로 넘어간다.
      - name: 변경 없음 — 직전 이미지를 이번 SHA 로 재태그
        id: retag
        if: >-
          (matrix.app == 'api' && needs.changes.outputs.api != 'true') ||
          (matrix.app == 'web' && needs.changes.outputs.web != 'true')
        continue-on-error: true
        run: |
          set -euo pipefail
          SRC="${IMAGE_PREFIX}/${{ matrix.app }}:latest"
          DST="${IMAGE_PREFIX}/${{ matrix.app }}:${GITHUB_SHA}"
          echo "재태그: $SRC → $DST"
          docker buildx imagetools create -t "$DST" "$SRC"

      - name: API 이미지 빌드 & 푸시
        if: >-
          matrix.app == 'api' &&
          (needs.changes.outputs.api == 'true' || steps.retag.outcome == 'failure')
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          platforms: linux/amd64
          # 변경 판별(changes 잡)이 이 라벨을 기준 커밋으로 쓴다
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/api:latest
            ${{ env.IMAGE_PREFIX }}/api:${{ github.sha }}
          # GitHub Actions cache 사용 (저장소당 10GB LRU 자동 관리)
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Web 이미지 빌드 & 푸시
        if: >-
          matrix.app == 'web' &&
          (needs.changes.outputs.web == 'true' || steps.retag.outcome == 'failure')
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          platforms: linux/amd64
          # 변경 판별(changes 잡)이 이 라벨을 기준 커밋으로 쓴다
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_UPLOADS_BASE_URL=${{ vars.NEXT_PUBLIC_UPLOADS_BASE_URL }}
            NEXT_PUBLIC_GA_ID=${{ vars.NEXT_PUBLIC_GA_ID }}
            NEXT_PUBLIC_ADSENSE_SLOT_DEFAULT=${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_DEFAULT }}
            NEXT_PUBLIC_ADSENSE_SLOT_LANDING=${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_LANDING }}
            NEXT_PUBLIC_ADSENSE_SLOT_FEED=${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_FEED }}
            NEXT_PUBLIC_ADSENSE_SLOT_MATCH_HUB=${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_MATCH_HUB }}
            NEXT_PUBLIC_ADSENSE_SLOT_PROFILE=${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_PROFILE }}
            NEXT_PUBLIC_ADSENSE_SLOT_ARTICLE=${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_ARTICLE }}
            API_URL=http://api:4000
          tags: |
            ${{ env.IMAGE_PREFIX }}/web:latest
            ${{ env.IMAGE_PREFIX }}/web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # 이미지 빌드가 깨지면 CD 자체가 돌지 않아 조용히 배포가 멈춘다.
  # 배포 실패와 같은 채널로 알려 "왜 반영이 안 되지"를 없앤다.
  # 별도 잡으로 뺀 이유: matrix 안에 두면 api/web 양쪽이 깨질 때 알림이 두 번 간다.
  notify-failure:
    name: 빌드 실패 알림
    needs: [ci, bump, changes, docker]
    if: >-
      failure() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: 실패 알림 (Discord)
        env:
          WEBHOOK: ${{ secrets.DEPLOY_ALERT_DISCORD_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DEPLOY_ALERT_DISCORD_WEBHOOK 미설정 — 알림 생략"
            exit 0
          fi
          printf '{"content":"🚨 **NEXUS 이미지 빌드 실패** — 이번 커밋은 배포되지 않습니다.\\n커밋: `%s`\\n로그: %s"}' \
            "${GITHUB_SHA:0:7}" "$RUN_URL" \
            | curl -fsS -X POST -H "Content-Type: application/json" -d @- "$WEBHOOK" \
            || echo "알림 전송 실패(비치명)"
