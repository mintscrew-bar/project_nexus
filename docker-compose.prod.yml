name: nexus

# 컨테이너 로그가 무한히 쌓여 디스크를 잠식하는 것을 막는다.
# 2026-05-09 디스크 I/O 사고의 재발 방지책 중 하나 — 컨테이너당 최대 30MB.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexus-postgres
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 1024m
    memswap_limit: 1024m
    cpus: "1.5"
    pids_limit: 256
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-nexus}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus} -d ${POSTGRES_DB:-nexus}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    cpus: "0.5"
    pids_limit: 128
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    # 운영: GHCR에서 pull. 로컬 dev 폴백용으로 build 섹션은 유지.
    # 롤백 시: IMAGE_TAG=<commit-sha> docker compose -f docker-compose.prod.yml up -d
    image: ghcr.io/mintscrew-bar/project_nexus/api:${IMAGE_TAG:-latest}
    # ⚠️ 이 build 섹션은 로컬 dev 폴백 전용. 운영 호스트에서 --build 금지.
    # 빌드는 mem_limit 밖이라 3GB 힙을 무제한으로 써 WSL OOM을 재유발할 수 있다.
    # 운영/복구는 GHCR 이미지를 pull 한다. (docs/setup/OPERATIONS_RECOVERY.md 참고)
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nexus-api
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 1536m
    memswap_limit: 1536m
    cpus: "2.0"
    pids_limit: 256
    env_file:
      - ${NEXUS_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nexus}?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:${API_HOST_PORT:-4000}:4000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health > /dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s

  web:
    # 운영: GHCR에서 pull. 로컬 dev 폴백용으로 build 섹션은 유지.
    image: ghcr.io/mintscrew-bar/project_nexus/web:${IMAGE_TAG:-latest}
    # ⚠️ 이 build 섹션은 로컬 dev 폴백 전용. 운영 호스트에서 --build 금지.
    # 빌드는 mem_limit 밖이라 3GB 힙을 무제한으로 써 WSL OOM을 재유발할 수 있다.
    # 운영/복구는 GHCR 이미지를 pull 한다. (docs/setup/OPERATIONS_RECOVERY.md 참고)
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
        NEXT_PUBLIC_UPLOADS_BASE_URL: ${NEXT_PUBLIC_UPLOADS_BASE_URL:-}
        NEXT_PUBLIC_ADSENSE_SLOT_DEFAULT: ${NEXT_PUBLIC_ADSENSE_SLOT_DEFAULT:-}
        NEXT_PUBLIC_ADSENSE_SLOT_LANDING: ${NEXT_PUBLIC_ADSENSE_SLOT_LANDING:-}
        NEXT_PUBLIC_ADSENSE_SLOT_FEED: ${NEXT_PUBLIC_ADSENSE_SLOT_FEED:-}
        NEXT_PUBLIC_ADSENSE_SLOT_MATCH_HUB: ${NEXT_PUBLIC_ADSENSE_SLOT_MATCH_HUB:-}
        NEXT_PUBLIC_ADSENSE_SLOT_PROFILE: ${NEXT_PUBLIC_ADSENSE_SLOT_PROFILE:-}
        NEXT_PUBLIC_ADSENSE_SLOT_ARTICLE: ${NEXT_PUBLIC_ADSENSE_SLOT_ARTICLE:-}
        # Next.js rewrites destination — 컴포즈 내부 호스트명 사용
        API_URL: http://api:4000
    container_name: nexus-web
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 2048m
    memswap_limit: 2048m
    cpus: "2.0"
    pids_limit: 256
    environment:
      NODE_ENV: production
      API_URL: http://api:4000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_UPLOADS_BASE_URL: ${NEXT_PUBLIC_UPLOADS_BASE_URL:-}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz > /dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s

  nginx:
    image: nginx:alpine
    container_name: nexus-nginx
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    cpus: "0.5"
    pids_limit: 128
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz > /dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:2026.7.2
    container_name: nexus-cloudflared
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    cpus: "0.5"
    pids_limit: 128
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}
    depends_on:
      nginx:
        condition: service_healthy

  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: nexus-uptime-kuma
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    cpus: "1.0"
    pids_limit: 128
    volumes:
      - uptime_kuma_data:/app/data
    ports:
      - "127.0.0.1:${UPTIME_KUMA_HOST_PORT:-3001}:3001"

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  uptime_kuma_data:
