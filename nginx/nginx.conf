events {
  worker_connections 1024;
}

http {
  # WebSocket 업그레이드 헤더 맵 (Socket.IO 지원)
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # 신뢰 가능한 클라이언트 IP 단일 출처.
  # 이 서비스의 유일한 인그레스는 Cloudflare 터널이고(nginx는 호스트 포트 미바인딩),
  # CF-Connecting-IP는 Cloudflare 엣지가 항상 덮어쓰므로 클라이언트가 위조할 수 없다.
  # 반면 클라이언트가 직접 보낸 X-Forwarded-For는 엣지에서 보존되어 그대로 넘어오므로
  # 절대 신뢰하지 않는다. (위조 시 rate limit 우회로 이어짐)
  map $http_cf_connecting_ip $client_ip {
    default $http_cf_connecting_ip;
    ''      $remote_addr;
  }

  # Docker 내부 DNS (127.0.0.11) — 컨테이너 재시작 시 IP 동적 갱신
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    server_name _;

    # 동적 DNS 해석을 위해 변수로 upstream 선언
    set $api_upstream  http://api:4000;
    set $web_upstream  http://web:3000;

    # 클라이언트 최대 업로드 크기
    client_max_body_size 10m;

    # CSP Report-Only 위반 수집은 Next.js Route Handler가 처리한다.
    # 정확 경로를 먼저 선언해 일반 /api/* NestJS 프록시보다 우선시한다.
    location = /api/csp-report {
      proxy_pass $web_upstream;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $client_ip;
      proxy_set_header X-Forwarded-For $client_ip;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js가 refresh_token 쿠키를 설정하는 콜백 라우트 → web
    location = /api/auth/callback {
      proxy_pass $web_upstream;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $client_ip;
      proxy_set_header X-Forwarded-For $client_ip;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js 프록시 라우트 (refresh_token 쿠키 → Authorization 헤더 변환)
    location ~ ^/api/auth/(me|refresh|logout|login|register)$ {
      proxy_pass $web_upstream;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $client_ip;
      proxy_set_header X-Forwarded-For $client_ip;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 나머지 /api/auth/* (discord, google, agree, link 등) → NestJS API
    location /api/auth/ {
      proxy_pass $api_upstream;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $client_ip;
      proxy_set_header X-Forwarded-For $client_ip;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /api/* → NestJS API 서버로 프록시
    location /api/ {
      proxy_pass $api_upstream;
      proxy_http_version 1.1;

      # WebSocket 업그레이드 헤더
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      # 프록시 헤더
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $client_ip;
      proxy_set_header X-Forwarded-For $client_ip;
      proxy_set_header X-Forwarded-Proto $scheme;

      # 타임아웃 설정 (Socket.IO 롱폴링 대비)
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
    }

    # Socket.IO 네임스페이스들 → API 서버로 프록시
    # /socket.io/ 경로도 API로 전달
    location /socket.io/ {
      proxy_pass $api_upstream;
      proxy_http_version 1.1;

      # WebSocket: 버퍼링 비활성화 (프레임을 즉시 전달)
      proxy_buffering off;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $client_ip;
      proxy_set_header X-Forwarded-For $client_ip;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
    }

    # 헬스체크 전용 — 액세스 로그에서 제외해 실제 트래픽 통계를 흐리지 않는다.
    location = /healthz {
      access_log off;
      proxy_pass $web_upstream;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $client_ip;
      proxy_set_header X-Forwarded-For $client_ip;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /* → Next.js 웹 서버로 프록시
    location / {
      proxy_pass $web_upstream;
      proxy_http_version 1.1;

      # Next.js HMR WebSocket 지원
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $client_ip;
      proxy_set_header X-Forwarded-For $client_ip;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
